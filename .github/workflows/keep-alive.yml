name: Keep Streamlit App Alive

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to run it manually from GitHub if needed

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        # Replace the URL below with your actual Streamlit app link
        run: curl -sL "https://YOUR-APP-NAME.streamlit.app" > /dev/null
